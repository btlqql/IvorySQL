name: Autonomous transaction reproduction

on:
  push:
    branches:
      - codex/repro-autonomous-1695

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, patched]

    steps:
      - uses: actions/checkout@v4

      - name: Restore the unpatched implementation
        if: matrix.variant == 'baseline'
        run: git checkout c3529ba4789ee220caefc858e58bbe6f1563ad14 -- src/pl/plisql/src/pl_autonomous.c

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git lcov bison flex \
            libkrb5-dev libssl-dev libldap-dev libpam-dev python3-dev \
            tcl-dev libperl-dev gettext libxml2-dev libxslt-dev \
            libreadline-dev libedit-dev uuid-dev libossp-uuid-dev \
            libipc-run-perl libtime-hires-perl libtest-simple-perl \
            libicu-dev libnuma-dev

      - name: Configure
        run: |
          curl -L -o cpanm http://cpanmin.us
          chmod +x cpanm
          sudo ./cpanm IPC::Run
          ./configure \
            --prefix="$PWD/inst" \
            --enable-cassert --enable-debug --enable-tap-tests --enable-rpath \
            --with-tcl --with-python --with-gssapi --with-pam --with-ldap \
            --with-openssl --with-libedit-preferred --with-uuid=e2fs \
            --with-ossp-uuid --with-libxml --with-libxslt --with-perl \
            --with-icu --with-libnuma --enable-injection-points --enable-nls

      - name: Build and install
        run: make -j2 && make install

      - name: Run focused autonomous regression
        shell: bash
        run: |
          set +e
          make -C src/pl/plisql/src oracle-pg-check \
            REGRESS=plisql_autonomous 2>&1 | tee autonomous-${{ matrix.variant }}.log
          status=${PIPESTATUS[0]}
          set -e

          find . -name regression.diffs -print \
            -exec sh -c 'cat "$1"' sh {} \; | tee -a autonomous-${{ matrix.variant }}.log

          if [[ "${{ matrix.variant }}" == "baseline" ]]; then
            if [[ $status -eq 0 ]]; then
              echo "The unpatched implementation unexpectedly passed" >&2
              exit 1
            fi
            echo "The regression reproduced on the unpatched implementation"
            exit 0
          fi

          exit "$status"

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-${{ matrix.variant }}
          path: autonomous-${{ matrix.variant }}.log
